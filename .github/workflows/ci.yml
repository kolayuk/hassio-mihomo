name: Update Mihomo & metacubexd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild mihomo even if upstream has not changed"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mihomo_sha: ${{ steps.check.outputs.mihomo_sha }}
      mihomo_changed: ${{ steps.check.outputs.mihomo_changed }}
      ui_version: ${{ steps.check.outputs.ui_version }}
      ui_changed: ${{ steps.check.outputs.ui_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          MIHOMO_SHA=$(git ls-remote https://github.com/MetaCubeX/mihomo.git refs/heads/Meta | cut -f1)
          CURRENT_SHA=$(cat mihomo/mihomo.version 2>/dev/null | tr -d '[:space:]' || true)
          UI_VERSION=$(gh api repos/MetaCubeX/metacubexd/releases/latest --jq .tag_name)
          CURRENT_UI=$(cat mihomo/metacubexd.version 2>/dev/null | tr -d '[:space:]' || true)

          echo "mihomo: ${CURRENT_SHA:-none} -> ${MIHOMO_SHA}"
          echo "metacubexd: ${CURRENT_UI:-none} -> ${UI_VERSION}"

          [ -n "$MIHOMO_SHA" ] && [ -n "$UI_VERSION" ] || { echo "Failed to resolve upstream versions"; exit 1; }

          MIHOMO_CHANGED=false
          if [ "$MIHOMO_SHA" != "$CURRENT_SHA" ] || [ "$FORCE" = "true" ]; then MIHOMO_CHANGED=true; fi
          UI_CHANGED=false
          if [ "$UI_VERSION" != "$CURRENT_UI" ]; then UI_CHANGED=true; fi

          {
            echo "mihomo_sha=$MIHOMO_SHA"
            echo "mihomo_changed=$MIHOMO_CHANGED"
            echo "ui_version=$UI_VERSION"
            echo "ui_changed=$UI_CHANGED"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.mihomo_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            goarch: arm64
            goarm: ""
          - arch: amd64
            goarch: amd64
            goarm: ""
          - arch: armv7
            goarch: arm
            goarm: 7
          - arch: armhf
            goarch: arm
            goarm: 6
          - arch: i386
            goarch: "386"
            goarm: ""
    steps:
      - name: Fetch Mihomo source
        run: |
          git clone -b Meta --single-branch https://github.com/MetaCubeX/mihomo.git upstream-mihomo
          cd upstream-mihomo
          git checkout ${{ needs.check.outputs.mihomo_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream-mihomo/go.mod
          cache-dependency-path: upstream-mihomo/go.sum

      - name: Build binary for ${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          cd upstream-mihomo
          VERSION=$(git describe --tags --always)
          go build -v -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$VERSION' \
                      -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u)' \
                      -w -s" \
            -tags "with_gvisor" \
            -o ../mihomo-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-${{ matrix.arch }}
          path: mihomo-${{ matrix.arch }}

  commit:
    needs: [check, build]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.check.outputs.mihomo_changed == 'true' || needs.check.outputs.ui_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout add-on repo
        uses: actions/checkout@v4

      - name: Download mihomo binaries
        if: needs.check.outputs.mihomo_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          path: mihomo_temp
          pattern: mihomo-*
          merge-multiple: true

      - name: Update files and bump add-on version
        env:
          MIHOMO_CHANGED: ${{ needs.check.outputs.mihomo_changed }}
          UI_CHANGED: ${{ needs.check.outputs.ui_changed }}
          MIHOMO_SHA: ${{ needs.check.outputs.mihomo_sha }}
          UI_VERSION: ${{ needs.check.outputs.ui_version }}
        run: |
          MSG=()
          if [ "$MIHOMO_CHANGED" = "true" ]; then
            cp mihomo_temp/mihomo-* mihomo/
            chmod +x mihomo/mihomo-*
            echo "$MIHOMO_SHA" > mihomo/mihomo.version
            MSG+=("mihomo ${MIHOMO_SHA:0:7}")
          fi
          if [ "$UI_CHANGED" = "true" ]; then
            echo "$UI_VERSION" > mihomo/metacubexd.version
            MSG+=("metacubexd ${UI_VERSION}")
          fi

          # Bump patch version so Home Assistant offers the update and rebuilds the image
          CUR=$(grep -E '^version:' mihomo/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          IFS=. read -r MAJ MIN PAT <<< "$CUR"
          NEW="${MAJ}.${MIN}.$((PAT + 1))"
          sed -i -E "s/^version:.*/version: \"${NEW}\"/" mihomo/config.yaml
          echo "Add-on version: $CUR -> $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mihomo/
          git commit -m "chore: bump ${MSG[*]} (add-on ${NEW})" || exit 0
          git push
